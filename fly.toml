app = "foodtruck-api"
primary_region = "gru"

[deploy]
  release_command = "node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m src/infra/db/migrations -j sql -d MIGRATE_DATABASE_URL up"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true

  [[http_service.checks]]
    method = "GET"
    path = "/health/live"
    interval = "15s"
    timeout = "5s"
    grace_period = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
